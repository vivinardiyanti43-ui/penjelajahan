<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penjelajahan Buah & Angka - Gim Edukasi TK A</title>
    <!-- Tailwind CSS for UI controls & layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for vibrant kid-friendly typography -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: url('https://i.imgur.com/2qO2jyt.png'), url('https://i.imgur.com/2qO2jyt.jpg'), linear-gradient(180deg, #87CEEB 0%, #E0F6FF 60%, #B5EAD7 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            touch-action: none; /* Prevents unwanted scrolling on mobile touch dragging */
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        /* Custom pulse keyframe for UI attention */
        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }
        .animate-bounce-gentle {
            animation: gentle-bounce 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center relative select-none">

    <!-- Hidden YouTube Player Container for Background Music (Video ID: 5v8jivu9Yn4) -->
    <div id="yt-player" class="pointer-events-none absolute w-1 h-1 -left-[9999px] opacity-0 overflow-hidden" aria-hidden="true"></div>

    <!-- Top Bar Navigation & Info -->
    <header class="w-full max-w-4xl px-4 pt-3 flex justify-between items-center z-10">
        <div class="flex items-center gap-2 bg-white/80 backdrop-blur-md px-4 py-2 rounded-full shadow-md border-2 border-yellow-300">
            <span class="text-2xl">🍎</span>
            <div>
                <p class="text-xs text-gray-500 font-semibold leading-tight">PETUALANGAN</p>
                <h1 id="level-title" class="text-base sm:text-lg font-bold text-emerald-700 leading-tight">Level 1: Hutan Apel</h1>
            </div>
        </div>

        <!-- Progress Stars & Controls -->
        <div class="flex items-center gap-3">
            <div id="star-container" class="flex gap-1 bg-white/80 backdrop-blur-md px-3 py-2 rounded-full shadow-md border-2 border-amber-300 text-xl">
                <span id="star-1" class="opacity-30 transition-all duration-300">⭐</span>
                <span id="star-2" class="opacity-30 transition-all duration-300">⭐</span>
                <span id="star-3" class="opacity-30 transition-all duration-300">⭐</span>
            </div>
            
            <button id="btn-sound" class="bg-white/90 p-2.5 rounded-full shadow-md text-xl border-2 border-sky-300 hover:bg-sky-50 active:scale-95 transition-transform" title="Suara On/Off">
                🔊
            </button>
            <button id="btn-restart" class="bg-amber-400 hover:bg-amber-500 text-white font-bold p-2.5 rounded-full shadow-md text-xl border-2 border-amber-300 active:scale-95 transition-transform" title="Ulangi Level">
                🔄
            </button>
        </div>
    </header>

    <!-- Main Interactive Canvas Viewport -->
    <main class="relative w-full h-full flex-grow flex items-center justify-center p-2">
        <canvas id="gameCanvas" class="w-full h-full rounded-3xl shadow-xl max-w-5xl max-h-[750px] border-4 border-white/60 bg-white/20 backdrop-blur-[2px]"></canvas>
        
        <!-- Interactive Instruction Speech Bubble Overlay -->
        <div id="speech-bubble" class="absolute top-4 left-1/2 -translate-x-1/2 bg-white/95 px-5 py-2.5 rounded-2xl shadow-lg border-2 border-orange-300 text-center pointer-events-none transition-all duration-300 animate-bounce-gentle max-w-xs sm:max-w-md">
            <p id="instruction-text" class="text-sm sm:text-base font-bold text-amber-800">
                Ayo hitung apelnya dan tarik ke keranjang angka yang cocok! 🧺
            </p>
        </div>
    </main>

    <!-- Level Complete Modal Dialog -->
    <div id="win-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-yellow-300 transform transition-all scale-95 opacity-0" id="win-card">
            <div class="text-6xl mb-2 animate-bounce">🎉</div>
            <h2 class="text-2xl sm:text-3xl font-bold text-amber-600 mb-1">Hebat Sekali!</h2>
            <p id="win-subtitle" class="text-gray-600 text-sm mb-4">Kamu berhasil mencocokkan semua buah!</p>
            
            <div class="flex justify-center gap-2 text-4xl mb-6">
                <span>⭐</span><span>⭐</span><span>⭐</span>
            </div>

            <button id="btn-next-level" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg text-lg border-b-4 border-emerald-700 active:scale-95 transition-transform flex items-center justify-center gap-2">
                <span>Lanjut Level Berikutnya</span> ➡️
            </button>
        </div>
    </div>

    <script>
        // Configuration and State Variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const instructionText = document.getElementById('instruction-text');
        const levelTitle = document.getElementById('level-title');
        const winModal = document.getElementById('win-modal');
        const winCard = document.getElementById('win-card');
        const btnNextLevel = document.getElementById('btn-next-level');
        const btnSound = document.getElementById('btn-sound');
        const btnRestart = document.getElementById('btn-restart');

        let isSoundOn = true;
        let currentLevelIndex = 0;
        let inactivityTimer = null;
        let hintActive = false;
        let hintProgress = 0;
        let draggedObject = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let animationFrameId = null;

        // Background Image Setup (Imgur link: https://i.imgur.com/2qO2jyt.png)
        const bgImage = new Image();
        bgImage.crossOrigin = "anonymous";
        let bgImageLoaded = false;
        bgImage.onload = () => { bgImageLoaded = true; };
        bgImage.onerror = () => {
            if (bgImage.src.endsWith('.png')) {
                bgImage.src = 'https://i.imgur.com/2qO2jyt.jpg';
            } else if (bgImage.src.endsWith('.jpg')) {
                bgImage.src = 'https://i.imgur.com/2qO2jyt.jpeg';
            }
        };
        bgImage.src = 'https://i.imgur.com/2qO2jyt.png';

        // YouTube API Integration for Background Music (Video ID: 5v8jivu9Yn4)
        let ytPlayer = null;
        let isYtReady = false;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        window.onYouTubeIframeAPIReady = function() {
            ytPlayer = new YT.Player('yt-player', {
                height: '1',
                width: '1',
                videoId: '5v8jivu9Yn4',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'loop': 1,
                    'playlist': '5v8jivu9Yn4',
                    'playsinline': 1,
                    'enablejsapi': 1
                },
                events: {
                    'onReady': (event) => {
                        isYtReady = true;
                        event.target.setVolume(30); // Safe background volume level for young children
                        if (isSoundOn) {
                            event.target.playVideo();
                        }
                    }
                }
            });
        };

        function startBgmIfAllowed() {
            if (ytPlayer && isYtReady && isSoundOn) {
                try {
                    if (typeof ytPlayer.getPlayerState === 'function' && ytPlayer.getPlayerState() !== 1) {
                        ytPlayer.playVideo();
                    }
                } catch(err) {
                    // Ignore autoplay restrictions until first gesture
                }
            }
        }

        // Global User Interaction Listener to unlock YouTube Audio Autoplay
        const unlockAudio = () => {
            startBgmIfAllowed();
            window.removeEventListener('pointerdown', unlockAudio);
            window.removeEventListener('touchstart', unlockAudio);
        };
        window.addEventListener('pointerdown', unlockAudio);
        window.addEventListener('touchstart', unlockAudio);

        // Audio System (Synthesizer + Web Speech API for Kid Friendly Voice)
        const AudioEngine = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playPop() {
                if (!isSoundOn) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            },
            playChime() {
                if (!isSoundOn) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.3);
                });
            },
            playBoing() {
                if (!isSoundOn) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            },
            speak(text) {
                if (!isSoundOn || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel(); // stop current utterance
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 0.9; // clear, comfortable tempo for young children
                utterance.pitch = 1.2; // friendly, warm pitch
                window.speechSynthesis.speak(utterance);
            }
        };

        // Level Definitions for Scaffolding Progression
        const LEVELS = [
            {
                name: "Level 1: Hutan Apel",
                targetNumbers: [1, 2, 3],
                fruitType: "🍎",
                fruitName: "Apel",
                description: "Yuk, pasangkan jumlah apel dengan keranjang angka yang sesuai!"
            },
            {
                name: "Level 2: Kebun Jeruk",
                targetNumbers: [2, 3, 4],
                fruitType: "🍊",
                fruitName: "Jeruk",
                description: "Bagus! Sekarang mari bantu Kiki menghitung buah jeruk!"
            },
            {
                name: "Level 3: Lembah Pisang",
                targetNumbers: [3, 4, 5],
                fruitType: "🍌",
                fruitName: "Pisang",
                description: "Hebat! Petualangan berlanjut di Lembah Pisang!"
            },
            {
                name: "Level 4: Puncak Stroberi",
                targetNumbers: [4, 5, 6],
                fruitType: "🍓",
                fruitName: "Stroberi",
                description: "Luar biasa! Mari kumpulkan stroberi lezat di Puncak Gunung!"
            }
        ];

        // Object Entities State
        let baskets = [];
        let fruitCards = [];
        let particles = [];

        // Mascot Kiki State Machine
        const kiki = {
            x: 0,
            y: 0,
            width: 110,
            height: 130,
            state: 'idle', // idle, happy, thinking
            animTime: 0,
            jumpOffset: 0,
            eyeBlink: false,
            draw(ctx) {
                this.animTime += 0.05;
                if (this.state === 'happy') {
                    this.jumpOffset = Math.sin(this.animTime * 12) * 20;
                } else {
                    this.jumpOffset = Math.sin(this.animTime * 2) * 4;
                }

                ctx.save();
                ctx.translate(this.x, this.y + this.jumpOffset);

                // Ears
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#E0E0E0';
                ctx.lineWidth = 3;
                
                // Left Ear
                ctx.beginPath();
                ctx.ellipse(-22, -60, 12, 35, -0.1, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#FFB6C1';
                ctx.beginPath();
                ctx.ellipse(-22, -60, 6, 22, -0.1, 0, Math.PI * 2);
                ctx.fill();

                // Right Ear
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.ellipse(22, -60, 12, 35, 0.1, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#FFB6C1';
                ctx.beginPath();
                ctx.ellipse(22, -60, 6, 22, 0.1, 0, Math.PI * 2);
                ctx.fill();

                // Head
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(0, -15, 42, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Cheeks
                ctx.fillStyle = 'rgba(255, 182, 193, 0.6)';
                ctx.beginPath();
                ctx.arc(-22, -5, 9, 0, Math.PI * 2);
                ctx.arc(22, -5, 9, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#222222';
                if (Math.sin(this.animTime * 0.5) > 0.95 || this.eyeBlink) {
                    // Blinking
                    ctx.fillRect(-18, -20, 10, 2);
                    ctx.fillRect(8, -20, 10, 2);
                } else {
                    // Open Eyes
                    ctx.beginPath();
                    ctx.arc(-14, -20, 6, 0, Math.PI * 2);
                    ctx.arc(14, -20, 6, 0, Math.PI * 2);
                    ctx.fill();
                    // Catchlights
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(-16, -22, 2, 0, Math.PI * 2);
                    ctx.arc(12, -22, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Nose & Mouth
                ctx.fillStyle = '#FF69B4';
                ctx.beginPath();
                ctx.ellipse(0, -10, 4, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#444444';
                ctx.lineWidth = 2;
                ctx.beginPath();
                if (this.state === 'happy') {
                    ctx.arc(0, -8, 8, 0.1, Math.PI - 0.1);
                } else {
                    ctx.arc(-4, -8, 4, 0, Math.PI * 0.8);
                    ctx.arc(4, -8, 4, Math.PI * 0.2, Math.PI);
                }
                ctx.stroke();

                // Body & Outfit
                ctx.fillStyle = '#38BDF8'; // Blue vest
                ctx.beginPath();
                ctx.roundRect(-28, 20, 56, 45, 15);
                ctx.fill();
                ctx.strokeStyle = '#0284C7';
                ctx.stroke();

                // Paws / Hands
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                if (this.state === 'happy') {
                    ctx.arc(-35, 10, 10, 0, Math.PI * 2); // Waving up
                    ctx.arc(35, 10, 10, 0, Math.PI * 2);
                } else {
                    ctx.arc(-32, 35, 9, 0, Math.PI * 2);
                    ctx.arc(32, 35, 9, 0, Math.PI * 2);
                }
                ctx.fill(); ctx.stroke();

                ctx.restore();
            }
        };

        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            setupLevelObjects();
        }

        window.addEventListener('resize', resizeCanvas);

        function setupLevelObjects() {
            const currentLevel = LEVELS[currentLevelIndex];
            levelTitle.innerText = currentLevel.name;
            instructionText.innerText = currentLevel.description;

            const w = canvas.width;
            const h = canvas.height;

            // Position Mascot Kiki
            kiki.x = w * 0.12;
            kiki.y = h * 0.45;

            // Setup Baskets at bottom
            baskets = [];
            const basketCount = currentLevel.targetNumbers.length;
            const basketWidth = Math.min(130, w * 0.24);
            const basketHeight = 110;
            const basketY = h - basketHeight - 25;
            const totalBasketsWidth = basketCount * basketWidth + (basketCount - 1) * (w * 0.05);
            const startX = (w - totalBasketsWidth) / 2 + basketWidth / 2;

            currentLevel.targetNumbers.forEach((num, index) => {
                const bx = startX + index * (basketWidth + w * 0.05);
                baskets.push({
                    number: num,
                    x: bx,
                    y: basketY,
                    width: basketWidth,
                    height: basketHeight,
                    isMatched: false,
                    scale: 1,
                    glow: false
                });
            });

            // Setup Fruit Cards at top (Shuffled order)
            fruitCards = [];
            const shuffledNumbers = [...currentLevel.targetNumbers].sort(() => Math.random() - 0.5);
            const cardWidth = Math.min(120, w * 0.22);
            const cardHeight = 110;
            const cardY = h * 0.18;
            const startCardX = (w - (shuffledNumbers.length * cardWidth + (shuffledNumbers.length - 1) * (w * 0.04))) / 2 + cardWidth / 2;

            shuffledNumbers.forEach((count, index) => {
                const cx = startCardX + index * (cardWidth + w * 0.04);
                fruitCards.push({
                    id: 'fruit_' + index,
                    count: count,
                    fruitType: currentLevel.fruitType,
                    fruitName: currentLevel.fruitName,
                    x: cx,
                    y: cardY,
                    homeX: cx,
                    homeY: cardY,
                    width: cardWidth,
                    height: cardHeight,
                    isDragging: false,
                    isMatched: false,
                    scale: 1,
                    magneticTarget: null
                });
            });

            resetInactivityTimer();
            updateStarsDisplay();
        }

        function drawBasket(b) {
            ctx.save();
            ctx.translate(b.x, b.y + b.height / 2);
            ctx.scale(b.scale, b.scale);

            // Magnetic Glow Effect
            if (b.glow || (hintActive && !b.isMatched)) {
                ctx.shadowColor = '#F59E0B';
                ctx.shadowBlur = 20;
                ctx.fillStyle = 'rgba(254, 240, 138, 0.5)';
                ctx.beginPath();
                ctx.arc(0, 0, b.width * 0.65, 0, Math.PI * 2);
                ctx.fill();
            }

            // Basket Woven Body
            ctx.fillStyle = '#D97706';
            ctx.strokeStyle = '#78350F';
            ctx.lineWidth = 4;

            ctx.beginPath();
            ctx.moveTo(-b.width / 2, -b.height / 4);
            ctx.lineTo(-b.width / 2 + 10, b.height / 2);
            ctx.quadraticCurveTo(0, b.height / 2 + 15, b.width / 2 - 10, b.height / 2);
            ctx.lineTo(b.width / 2, -b.height / 4);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Rim
            ctx.fillStyle = '#F59E0B';
            ctx.beginPath();
            ctx.roundRect(-b.width / 2 - 5, -b.height / 4 - 12, b.width + 10, 20, 8);
            ctx.fill(); ctx.stroke();

            // Basket Label Badge with Number
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#B45309';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 10, 28, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            // Big Clear Kid-Friendly Number
            ctx.fillStyle = b.isMatched ? '#10B981' : '#1E293B';
            ctx.font = 'bold 32px Fredoka, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.number, 0, 12);

            ctx.restore();
        }

        function drawFruitCard(card) {
            if (card.isMatched) return; // Hide matched card inside basket

            ctx.save();
            ctx.translate(card.x, card.y);

            // Hint bouncing animation
            let renderScale = card.scale;
            if (hintActive && !card.isDragging) {
                renderScale *= (1 + Math.sin(hintProgress * 6) * 0.08);
            }
            ctx.scale(renderScale, renderScale);

            // Drop shadow
            ctx.shadowColor = card.isDragging ? 'rgba(0,0,0,0.3)' : 'rgba(0,0,0,0.15)';
            ctx.shadowBlur = card.isDragging ? 20 : 8;
            ctx.shadowOffsetY = card.isDragging ? 12 : 4;

            // Card background container
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = card.isDragging ? '#F59E0B' : '#BAE6FD';
            ctx.lineWidth = card.isDragging ? 4 : 3;
            ctx.beginPath();
            ctx.roundRect(-card.width / 2, -card.height / 2, card.width, card.height, 20);
            ctx.fill(); ctx.stroke();

            // Reset shadow for content inside
            ctx.shadowColor = 'transparent';

            // Arrange Fruit Emojis Grid inside Card
            const count = card.count;
            ctx.font = count > 4 ? '26px sans-serif' : '32px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Fruit Layout Grid Algorithm
            let positions = [];
            if (count === 1) {
                positions = [{ x: 0, y: 0 }];
            } else if (count === 2) {
                positions = [{ x: -20, y: 0 }, { x: 20, y: 0 }];
            } else if (count === 3) {
                positions = [{ x: -22, y: -12 }, { x: 22, y: -12 }, { x: 0, y: 18 }];
            } else if (count === 4) {
                positions = [{ x: -20, y: -18 }, { x: 20, y: -18 }, { x: -20, y: 18 }, { x: 20, y: 18 }];
            } else if (count === 5) {
                positions = [{ x: -22, y: -20 }, { x: 22, y: -20 }, { x: 0, y: 0 }, { x: -22, y: 20 }, { x: 22, y: 20 }];
            } else { // 6 or more
                positions = [
                    { x: -24, y: -22 }, { x: 0, y: -22 }, { x: 24, y: -22 },
                    { x: -24, y: 18 }, { x: 0, y: 18 }, { x: 24, y: 18 }
                ];
            }

            positions.forEach(pos => {
                ctx.fillText(card.fruitType, pos.x, pos.y);
            });

            ctx.restore();
        }

        function createCelebrationParticles(x, y) {
            const colors = ['#F59E0B', '#10B981', '#3B82F6', '#EC4899', '#8B5CF6'];
            for (let i = 0; i < 25; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.7) * 10,
                    size: Math.random() * 8 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    life: 1
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3; // Gravity
                p.alpha -= 0.02;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handlePointerStart(e) {
            e.preventDefault();
            startBgmIfAllowed();
            resetInactivityTimer();
            const pos = getPointerPos(e);

            // Check if touched any fruit card
            for (let i = fruitCards.length - 1; i >= 0; i--) {
                const card = fruitCards[i];
                if (card.isMatched) continue;

                const dx = pos.x - card.x;
                const dy = pos.y - card.y;
                if (Math.abs(dx) < card.width / 2 && Math.abs(dy) < card.height / 2) {
                    draggedObject = card;
                    card.isDragging = true;
                    card.scale = 1.15;
                    dragOffsetX = dx;
                    dragOffsetY = dy;

                    // Audio Counting Feedback
                    AudioEngine.playPop();
                    const numberWords = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan"];
                    AudioEngine.speak(`${card.count} ${card.fruitName}`);

                    // Re-order card to draw on top
                    fruitCards.splice(i, 1);
                    fruitCards.push(card);
                    break;
                }
            }
        }

        function handlePointerMove(e) {
            if (!draggedObject) return;
            e.preventDefault();
            resetInactivityTimer();
            const pos = getPointerPos(e);

            draggedObject.x = pos.x - dragOffsetX;
            draggedObject.y = pos.y - dragOffsetY;

            // Magnetic Snap Check to nearest basket
            const magneticDistance = 90; // Snap threshold in px
            let nearestBasket = null;
            let minDist = Infinity;

            baskets.forEach(b => {
                b.glow = false;
                if (b.isMatched) return;

                const dist = Math.hypot(draggedObject.x - b.x, draggedObject.y - b.y);
                if (dist < magneticDistance && dist < minDist) {
                    minDist = dist;
                    nearestBasket = b;
                }
            });

            if (nearestBasket) {
                nearestBasket.glow = true;
                // Magnetic Pull towards target center
                draggedObject.x += (nearestBasket.x - draggedObject.x) * 0.25;
                draggedObject.y += (nearestBasket.y - draggedObject.y) * 0.25;
            }
        }

        function handlePointerEnd(e) {
            if (!draggedObject) return;
            e.preventDefault();
            resetInactivityTimer();

            const card = draggedObject;
            card.isDragging = false;
            card.scale = 1.0;

            // Check matching target drop
            let matchedBasket = null;
            baskets.forEach(b => {
                b.glow = false;
                if (b.isMatched) return;

                const dist = Math.hypot(card.x - b.x, card.y - b.y);
                if (dist < 85) {
                    matchedBasket = b;
                }
            });

            if (matchedBasket) {
                if (matchedBasket.number === card.count) {
                    // CORRECT MATCH!
                    card.isMatched = true;
                    matchedBasket.isMatched = true;
                    card.x = matchedBasket.x;
                    card.y = matchedBasket.y;

                    // Animation & Audio Feedback
                    kiki.state = 'happy';
                    AudioEngine.playChime();
                    AudioEngine.speak("Hebat!");
                    createCelebrationParticles(matchedBasket.x, matchedBasket.y);

                    setTimeout(() => { kiki.state = 'idle'; }, 1500);

                    // Check Level Completion
                    checkLevelWin();
                } else {
                    // WRONG MATCH - Gentle Bounce Back
                    AudioEngine.playBoing();
                    AudioEngine.speak("Yuk, coba lagi!");
                    animateBounceBack(card);
                }
            } else {
                // Dropped outside target - return home
                animateBounceBack(card);
            }

            draggedObject = null;
        }

        function animateBounceBack(card) {
            const startX = card.x;
            const startY = card.y;
            const targetX = card.homeX;
            const targetY = card.homeY;
            let progress = 0;

            function step() {
                progress += 0.12;
                if (progress >= 1) {
                    card.x = targetX;
                    card.y = targetY;
                } else {
                    // Ease out cubic
                    const ease = 1 - Math.pow(1 - progress, 3);
                    card.x = startX + (targetX - startX) * ease;
                    card.y = startY + (targetY - startY) * ease;
                    requestAnimationFrame(step);
                }
            }
            step();
        }

        function checkLevelWin() {
            const allMatched = fruitCards.every(c => c.isMatched);
            if (allMatched) {
                setTimeout(() => {
                    AudioEngine.playChime();
                    AudioEngine.speak("Luar biasa! Level selesai!");
                    winModal.classList.remove('hidden');
                    setTimeout(() => {
                        winCard.classList.remove('scale-95', 'opacity-0');
                        winCard.classList.add('scale-100', 'opacity-100');
                    }, 50);
                }, 600);
            }
        }

        function updateStarsDisplay() {
            const matchedCount = baskets.filter(b => b.isMatched).length;
            for (let i = 1; i <= 3; i++) {
                const starEl = document.getElementById(`star-${i}`);
                if (i <= matchedCount) {
                    starEl.classList.remove('opacity-30');
                    starEl.classList.add('scale-125');
                    setTimeout(() => starEl.classList.remove('scale-125'), 300);
                } else {
                    starEl.classList.add('opacity-30');
                }
            }
        }

        function resetInactivityTimer() {
            hintActive = false;
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                triggerHint();
            }, 5000); // 5 Seconds Inactivity
        }

        function triggerHint() {
            hintActive = true;
            AudioEngine.speak("Sentuh buah dan geser ke nomor yang sama ya!");
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render custom background image on canvas if loaded
            if (bgImageLoaded) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            }

            // Update Hint Animation Time
            if (hintActive) {
                hintProgress += 0.05;
            }

            // Draw Mascot Kiki
            kiki.draw(ctx);

            // Draw Baskets Target
            baskets.forEach(drawBasket);

            // Draw Fruit Cards
            fruitCards.forEach(drawFruitCard);

            // Draw Particle FX
            updateAndDrawParticles();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('mousedown', handlePointerStart);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerEnd);

        canvas.addEventListener('touchstart', handlePointerStart, { passive: false });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerEnd, { passive: false });

        btnSound.addEventListener('click', () => {
            isSoundOn = !isSoundOn;
            btnSound.innerText = isSoundOn ? '🔊' : '🔇';
            if (ytPlayer && isYtReady) {
                if (isSoundOn) {
                    ytPlayer.unMute();
                    ytPlayer.playVideo();
                } else {
                    ytPlayer.pauseVideo();
                }
            }
        });

        btnRestart.addEventListener('click', () => {
            setupLevelObjects();
        });

        btnNextLevel.addEventListener('click', () => {
            winCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                winModal.classList.add('hidden');
                currentLevelIndex = (currentLevelIndex + 1) % LEVELS.length;
                setupLevelObjects();
            }, 200);
        });

        // Initialize Application
        window.onload = () => {
            resizeCanvas();
            gameLoop();
        };
    </script>
</body>
</html>
